services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    network_mode: host
    command: ["start-dev", "--http-port=8180", "--http-management-port=9180", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      TEMPORAL_ADMIN_PASSWORD: ${TEMPORAL_ADMIN_PASSWORD}
      KEYCLOAK_UI_CLIENT_SECRET: ${KEYCLOAK_UI_CLIENT_SECRET}
      KEYCLOAK_DJANGO_CLIENT_SECRET: ${KEYCLOAK_DJANGO_CLIENT_SECRET}
      KEYCLOAK_WORKER_CLIENT_SECRET: ${KEYCLOAK_WORKER_CLIENT_SECRET}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9180 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 30

  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER}
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_DB_USER}"]
      interval: 2s
      retries: 30

  temporal-schema:
    image: temporalio/admin-tools:latest
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: temporal-postgres
      SQL_PORT: 5432
      SQL_USER: ${TEMPORAL_DB_USER}
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for db in temporal temporal_visibility; do
          dir=$$([ $$db = temporal ] && echo temporal || echo visibility)
          temporal-sql-tool --db $$db create-database || true
          temporal-sql-tool --db $$db setup-schema -v 0.0
          temporal-sql-tool --db $$db update-schema -d /etc/temporal/schema/postgresql/v12/$$dir/versioned
        done

  temporal:
    image: temporalio/server:latest
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:7233:7233"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB: postgres12
      POSTGRES_SEEDS: temporal-postgres
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_DB_USER}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      TEMPORAL_AUTH_AUTHORIZER: default
      TEMPORAL_AUTH_CLAIM_MAPPER: default
      TEMPORAL_JWT_KEY_SOURCE1: http://host.docker.internal:8180/realms/rag/protocol/openid-connect/certs
      TEMPORAL_JWT_PERMISSIONS_CLAIM: permissions
      USE_INTERNAL_FRONTEND: "true"
      TEMPORAL_SERVICES: frontend,internal-frontend,history,matching,worker
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro

  temporal-setup:
    image: temporalio/admin-tools:latest
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7236
    entrypoint: ["sh", "-ec"]
    command:
      - |
        until temporal operator cluster health; do sleep 2; done
        temporal operator namespace describe -n default || temporal operator namespace create -n default --retention 7d
        until temporal operator search-attribute list -n default > /dev/null; do sleep 2; done
        for attr in CurrentActivity:Keyword Batches:Keyword ActivitiesDone:Int ActivitiesLeft:Int; do
          temporal operator search-attribute create -n default --name $${attr%%:*} --type $${attr##*:} || true
        done
        temporal operator search-attribute list -n default

  temporal-ui:
    image: temporalio/ui:latest
    network_mode: host
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      TEMPORAL_UI_PORT: 8233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
      TEMPORAL_CSRF_COOKIE_INSECURE: "true"
      TEMPORAL_AUTH_ENABLED: "true"
      TEMPORAL_AUTH_TYPE: oidc
      TEMPORAL_AUTH_REDIRECT_TO_PROVIDER: "true"
      TEMPORAL_AUTH_PROVIDER_URL: http://localhost:8180/realms/rag
      TEMPORAL_AUTH_ISSUER_URL: http://localhost:8180/realms/rag
      TEMPORAL_AUTH_CLIENT_ID: temporal-ui
      TEMPORAL_AUTH_CLIENT_SECRET: ${KEYCLOAK_UI_CLIENT_SECRET}
      TEMPORAL_AUTH_CALLBACK_URL: http://localhost:8233/auth/sso/callback
      TEMPORAL_AUTH_SCOPES: openid,profile,email
      TEMPORAL_AUTH_USE_ID_TOKEN_AS_BEARER: "true"

volumes:
  keycloak-data:
  temporal-postgres-data:
